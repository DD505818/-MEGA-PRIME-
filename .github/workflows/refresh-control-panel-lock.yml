name: Refresh Control Panel Lock

on:
  pull_request:
    paths:
      - control-panel/package.json
      - .github/workflows/refresh-control-panel-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: control-panel/package-lock.json

      - name: Regenerate and audit lockfile
        working-directory: control-panel
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npx --yes lockfile-lint --path package-lock.json --type npm --validate-https

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- control-panel/package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control-panel/package-lock.json
          git commit -m "fix(security): refresh control-panel lockfile"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
