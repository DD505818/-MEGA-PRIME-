name: Validation Lab

on:
  pull_request:
    paths:
      - "backtests/**"
      - "docs/validation-lab.md"
      - ".github/workflows/validation-lab.yml"
  push:
    branches: [main]
    paths:
      - "backtests/**"
      - "docs/validation-lab.md"
      - ".github/workflows/validation-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backtests/requirements.txt

      - name: Install validation dependencies
        run: python -m pip install -r backtests/requirements.txt

      - name: Syntax check
        run: python -m compileall backtests -q

      - name: Run validation invariants
        run: python -m pytest -q backtests/tests
