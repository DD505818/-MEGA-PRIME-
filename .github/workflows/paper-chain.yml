name: Deterministic PAPER chain

on:
  pull_request:
    paths:
      - "apps/risk-service/**"
      - "apps/execution-service/**"
      - "apps/portfolio-service/**"
      - "apps/truth-core/**"
      - "scripts/verify_paper_chain.py"
      - "docker-compose.yml"
      - "infra/db-migrations/**"
      - ".github/workflows/paper-chain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAPER_MODE: "true"
      LIVE_TRADING_ENABLED: "false"
      TRADING_MODE: "PAPER"
      PAPER_DETERMINISTIC: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Start deterministic infrastructure
        run: docker compose up -d zookeeper kafka redis postgres
      - name: Create PAPER lifecycle topics
        run: |
          for topic in \
            signals.raw signals.approved signals.rejected emergency.halt \
            orders.routed orders.fills market.prices; do
            docker compose exec -T kafka kafka-topics \
              --bootstrap-server kafka:9092 \
              --create --if-not-exists \
              --topic "$topic" --partitions 1 --replication-factor 1
          done
      - name: Start deterministic PAPER services
        run: |
          docker compose up -d --build \
            risk-engine execution-engine portfolio-service truth-core
      - name: Verify risk → fill → position → reconciliation → TruthCore
        run: python3 scripts/verify_paper_chain.py
      - name: Capture diagnostics
        if: always()
        run: docker compose logs --no-color --tail=300
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
