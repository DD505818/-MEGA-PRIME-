name: Deterministic PAPER chain

on:
  pull_request:
    paths:
      - "apps/risk-service/**"
      - "apps/execution-service/**"
      - "apps/portfolio-service/**"
      - "apps/truth-core/**"
      - "scripts/verify_paper_chain.py"
      - "docker-compose.yml"
      - ".github/workflows/paper-chain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAPER_MODE: "true"
      LIVE_TRADING_ENABLED: "false"
      TRADING_MODE: "PAPER"
      PAPER_DETERMINISTIC: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Start deterministic PAPER slice
        run: |
          docker compose up -d --build             zookeeper kafka redis postgres risk-engine execution-engine             portfolio-service truth-core
      - name: Verify risk → fill → position → reconciliation → TruthCore
        run: python3 scripts/verify_paper_chain.py
      - name: Capture diagnostics
        if: always()
        run: docker compose logs --no-color --tail=300
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
