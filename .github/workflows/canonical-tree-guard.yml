name: Canonical Tree Guard

# Phase 1A: the canonical platform is root apps/ + apps/web-ui.
# omega-prime-delta/, omega-prime-hardened/, omega-prime-pro/ are quarantined:
# they must not be built, deployed, or referenced by the active pipeline.
# See docs/canonical-tree.md.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    name: Quarantined trees stay inactive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Active entry points must not reference quarantined trees
        run: |
          set -e
          for f in docker-compose.yml Makefile; do
            for tree in omega-prime-delta omega-prime-hardened omega-prime-pro; do
              if grep -q "$tree" "$f"; then
                echo "FAIL: $f references quarantined tree $tree"
                exit 1
              fi
            done
          done
          echo "docker-compose.yml and Makefile are clean of quarantined trees"

      - name: Publish contexts must stay within apps/
        run: |
          set -e
          python3 - <<'EOF'
          import re, sys
          text = open('.github/workflows/publish-ghcr.yml').read()
          # Matrix entries may use a service-local apps/* context, or the
          # repository root when a Dockerfile needs shared canonical modules.
          entries = re.findall(
              r'-\s*\{[^}]*context:\s*([^,}\s]+)[^}]*dockerfile:\s*([^}\s]+)',
              text,
          )
          if not entries:
              print("FAIL: no publish matrix entries found")
              sys.exit(1)
          for context, dockerfile in entries:
              if any(q in context or q in dockerfile for q in (
                  'omega-prime-delta', 'omega-prime-hardened', 'omega-prime-pro'
              )):
                  print(f"FAIL: quarantined tree in publish entry: {context} {dockerfile}")
                  sys.exit(1)
              if context == '.':
                  if not dockerfile.startswith('apps/'):
                      print(f"FAIL: root context must target canonical apps/: {dockerfile}")
                      sys.exit(1)
              elif not context.startswith('apps/'):
                  print(f"FAIL: publish context outside canonical apps/: {context}")
                  sys.exit(1)
          print(f"publish contexts OK ({len(entries)} canonical services)")
          EOF

      - name: Quarantine markers must exist
        run: |
          set -e
          for tree in omega-prime-delta omega-prime-hardened omega-prime-pro; do
            test -f "$tree/QUARANTINED.md" || (echo "FAIL: $tree/QUARANTINED.md missing" && exit 1)
          done
          test -f docs/canonical-tree.md || (echo "FAIL: docs/canonical-tree.md missing" && exit 1)
          echo "quarantine markers present"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run risk-service tests
        run: |
          set -e
          cd apps/risk-service
          go test ./... 2>&1 | tail -3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gateway auth tests (websocket-gateway)
        run: |
          set -e
          cd apps/websocket-gateway
          npm ci --no-audit --no-fund
          npm test 2>&1 | tail -8
