name: Deploy Cloudflare PAPER

on:
  workflow_dispatch:
    inputs:
      confirm_mode:
        description: "Type PAPER to confirm this is a non-LIVE dashboard deployment"
        required: true
        default: "PAPER"

permissions:
  contents: read

concurrency:
  group: omega-cloudflare-paper
  cancel-in-progress: false

jobs:
  deploy:
    environment: paper
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.OMEGA_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_WS_URL: ${{ vars.OMEGA_PUBLIC_WS_URL }}
      PAPER_MODE: "true"
      TRADING_MODE: "PAPER"
      LIVE_TRADING_ENABLED: "false"
    defaults:
      run:
        working-directory: apps/web-ui
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web-ui/package-lock.json

      - name: Validate fail-closed PAPER configuration
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_mode }}" = "PAPER"
          test "$PAPER_MODE" = "true"
          test "$TRADING_MODE" = "PAPER"
          test "$LIVE_TRADING_ENABLED" = "false"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$NEXT_PUBLIC_API_BASE_URL"
          test -n "$NEXT_PUBLIC_WS_URL"
          [[ "$NEXT_PUBLIC_API_BASE_URL" == https://* ]]
          [[ "$NEXT_PUBLIC_WS_URL" == wss://* ]]
          [[ "$NEXT_PUBLIC_API_BASE_URL" != *localhost* ]]
          [[ "$NEXT_PUBLIC_WS_URL" != *localhost* ]]

      - name: Install locked web dependencies
        run: npm ci

      - name: Typecheck dashboard
        run: npm run typecheck

      - name: Build Next.js dashboard
        run: npm run build

      - name: Deploy PAPER dashboard to Cloudflare Workers
        run: >-
          npx --yes wrangler@4.102.0 deploy
          --yes
          --strict
          --name omega-prime-paper-web

      - name: Reassert non-LIVE release mode
        shell: bash
        run: |
          set -euo pipefail
          test "$PAPER_MODE" = "true"
          test "$TRADING_MODE" = "PAPER"
          test "$LIVE_TRADING_ENABLED" = "false"
