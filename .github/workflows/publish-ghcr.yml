name: Publish immutable GHCR images

on:
  pull_request:
    paths:
      - "apps/**"
      - ".github/workflows/publish-ghcr.yml"
  push:
    branches:
      - codex/kubernetes-production-manifests
    paths:
      - "apps/**"
      - ".github/workflows/publish-ghcr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: ghcr-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  publish:
    env:
      IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {name: market-data-service, context: apps/market-data-service, dockerfile: apps/market-data-service/Dockerfile}
          - {name: feature-engine, context: apps/feature-engine, dockerfile: apps/feature-engine/Dockerfile}
          - {name: agent-service, context: apps/agent-service, dockerfile: apps/agent-service/Dockerfile}
          - {name: fusion-engine, context: ., dockerfile: apps/fusion-engine/Dockerfile}
          - {name: risk-service, context: ., dockerfile: apps/risk-service/Dockerfile}
          - {name: execution-service, context: ., dockerfile: apps/execution-service/Dockerfile}
          - {name: capital-allocator, context: ., dockerfile: apps/capital-allocator/Dockerfile}
          - {name: portfolio-service, context: ., dockerfile: apps/portfolio-service/Dockerfile}
          - {name: truth-core, context: ., dockerfile: apps/truth-core/Dockerfile}
          - {name: llm-service, context: apps/llm-service, dockerfile: apps/llm-service/Dockerfile}
          - {name: websocket-gateway, context: apps/websocket-gateway, dockerfile: apps/websocket-gateway/Dockerfile}
          - {name: web-ui, context: apps/web-ui, dockerfile: apps/web-ui/Dockerfile}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/dd505818/omega-prime-${{ matrix.name }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.IMAGE_TAG }}
            org.opencontainers.image.title=omega-prime-${{ matrix.name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
