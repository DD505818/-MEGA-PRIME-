name: Kubernetes manifests

on:
  pull_request:
    paths:
      - "infra/kubernetes/**"
      - ".github/workflows/kubernetes-validate.yml"
  push:
    branches: [main]
    paths:
      - "infra/kubernetes/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4
      - name: Render production overlay
        run: kubectl kustomize infra/kubernetes/overlays/production > omega-production.yaml
      - name: Reject mutable production image tags
        run: |
          if grep -E 'image: .*:(latest|main|master)$' omega-production.yaml; then
            echo "Mutable production image tag detected"
            exit 1
          fi
      - name: Validate Kubernetes schemas
        run: |
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.6.7             -strict -summary -kubernetes-version 1.31.0 /work/omega-production.yaml
