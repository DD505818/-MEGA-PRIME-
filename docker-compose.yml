version: '3.8'

# ΩMEGA PRIME Δ — PAPER-only full-stack deployment.
# Mode contract (apps/modelock): only PAPER_MODE=true counts as paper;
# LIVE_TRADING_ENABLED=true vetoes unconditionally; malformed/absent mode
# fails closed; LiveLocked=true. There is no LIVE order-submission path
# anywhere in this stack — see DEPLOYMENT.md ("LIVE is architecturally
# unreachable"). Copy .env.example to .env and generate the fail-fast
# secrets before first boot.

services:
  # ── Infrastructure ───────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 15s
      retries: 10

  redis:
    image: redis:7.2.5-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: omega
      POSTGRES_DB: omega
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db-migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omega"]
      interval: 10s
      retries: 10

  # ── Data ingestion ───────────────────────────────────────────────────────────
  market-ingestion:
    build: ./apps/market-data-service
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      PAPER_MODE: ${PAPER_MODE:-true}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8090/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  feature-engine:
    build: ./apps/feature-engine
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PAPER_MODE: ${PAPER_MODE:-true}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── AI Strategy Engine ───────────────────────────────────────────────────────
  strategy-engine:
    build: ./apps/agent-service
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      PAPER_MODE: ${PAPER_MODE:-true}
      PORTFOLIO_EQUITY: ${PORTFOLIO_EQUITY:-100000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── Fusion Engine (CAFÉ-RC) ──────────────────────────────────────────────────
  fusion-engine:
    build:
      context: .
      dockerfile: apps/fusion-engine/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      PAPER_MODE: ${PAPER_MODE:-true}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8085/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── Risk Engine (AEGIS Governor, 14 gates) ───────────────────────────────────
  risk-engine:
    build:
      context: .
      dockerfile: apps/risk-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://postgres:omega@postgres:5432/omega}
      PAPER_MODE: ${PAPER_MODE:-true}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
      MAX_DAILY_LOSS: ${MAX_DAILY_LOSS:-0.02}
      MAX_DRAWDOWN: ${MAX_DRAWDOWN:-0.10}
      MAX_POSITIONS: ${MAX_POSITIONS:-8}
      MAX_NOTIONAL_PER_TRADE: ${MAX_NOTIONAL_PER_TRADE:-50000}
      MAX_LEVERAGE: ${MAX_LEVERAGE:-2.0}
      MIN_CONFIDENCE: ${MIN_CONFIDENCE:-0.60}
      RISK_PER_TRADE: ${RISK_PER_TRADE:-0.005}
      # Authority boundary (AEGIS signs approvals). Compose fails fast if
      # unset: no signing key, no trading. Generate with:
      #   go run ./apps/approval/cmd/keygen
      AEGIS_APPROVAL_PRIVKEY: ${AEGIS_APPROVAL_PRIVKEY:?missing - run keygen and export AEGIS_APPROVAL_PRIVKEY}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - copy .env.example to .env and generate a secret}
      TRUTHCORE_URL: http://truth-core:8084
      # Phase 4: TruthCore write authentication. Must match truth-core's
      # TRUTHCORE_WRITE_SECRET. Compose fails fast if unset: unauthenticated
      # audit writes are not acceptable in deployment.
      TRUTHCORE_WRITE_SECRET: ${TRUTHCORE_WRITE_SECRET:?missing - generate a random secret and export TRUTHCORE_WRITE_SECRET}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── Execution Engine (VULTURE Protocol) ──────────────────────────────────────
  execution-engine:
    build:
      context: .
      dockerfile: apps/execution-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      risk-engine:
        condition: service_started
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      PAPER_MODE: ${PAPER_MODE:-true}
      PAPER_DETERMINISTIC: ${PAPER_DETERMINISTIC:-true}
      # Authority boundary (VULTURE verifies AEGIS approvals). Must be the
      # public key matching the risk-engine AEGIS_APPROVAL_PRIVKEY.
      AEGIS_APPROVAL_PUBKEY: ${AEGIS_APPROVAL_PUBKEY:?missing - export AEGIS_APPROVAL_PUBKEY from keygen}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
      # Phase 4: audit-or-no-trade. Must match truth-core's secret.
      TRUTHCORE_URL: http://truth-core:8084
      TRUTHCORE_WRITE_SECRET: ${TRUTHCORE_WRITE_SECRET:?missing - export TRUTHCORE_WRITE_SECRET}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── Capital Allocator (Kelly) ────────────────────────────────────────────────
  capital-allocator:
    build:
      context: .
      dockerfile: apps/capital-allocator/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      PAPER_MODE: ${PAPER_MODE:-true}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── Portfolio Service ────────────────────────────────────────────────────────
  portfolio-service:
    build:
      context: .
      dockerfile: apps/portfolio-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://postgres:omega@postgres:5432/omega}
      PORTFOLIO_EQUITY: ${PORTFOLIO_EQUITY:-2000}
      PAPER_MODE: ${PAPER_MODE:-true}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── Truth-Core (Hash-Chained Audit) ──────────────────────────────────────────
  truth-core:
    build:
      context: .
      dockerfile: apps/truth-core/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://postgres:omega@postgres:5432/omega}
      PAPER_MODE: ${PAPER_MODE:-true}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
      # Phase 4: authenticates /append writes from risk-engine and
      # execution-engine. Without it the endpoint warns and accepts
      # unauthenticated writes (dev only).
      TRUTHCORE_WRITE_SECRET: ${TRUTHCORE_WRITE_SECRET:?missing - generate a random secret and export TRUTHCORE_WRITE_SECRET}
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8084/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── LLM Service ──────────────────────────────────────────────────────────────
  llm-service:
    build: ./apps/llm-service
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PAPER_MODE: ${PAPER_MODE:-true}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── WebSocket Gateway ────────────────────────────────────────────────────────
  websocket-gateway:
    build: ./apps/websocket-gateway
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PAPER_MODE: ${PAPER_MODE:-true}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - copy .env.example to .env and generate a secret}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      PORT: 3001
    ports:
      - "3001:3001"
    restart: unless-stopped

  # ── Web UI (Next.js 14, doctrine-hardened operator dashboard) ─────────────────
  # Observe/explain/request/display ONLY. No order entry, no kill-switch trigger,
  # no editable risk limits, GET-only API routes. Evidence Center reads campaign
  # artifacts from a read-only mount (EVIDENCE_DIR); absent artifacts render
  # UNKNOWN — the UI never fabricates state.
  web-ui:
    build: ./apps/web-ui
    depends_on:
      websocket-gateway:
        condition: service_started
      risk-engine:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      PAPER_MODE: ${PAPER_MODE:-true}
      NEXT_PUBLIC_WS_URL: ws://localhost:3001/ws
      NEXT_PUBLIC_API_URL: http://localhost:8080
      # Upstream read-only proxies for the dashboard API routes. Unset or
      # unreachable upstreams render as Unavailable in the UI — never stubbed.
      RISK_SERVICE_URL: http://risk-engine:8080
      EXECUTION_SERVICE_URL: http://execution-engine:8081
      PORTFOLIO_SERVICE_URL: http://portfolio-service:8083
      # Read-only evidence mount. EVIDENCE_HOST_DIR is a host path to a
      # directory holding campaign_summary.json, campaign2_summary.json, and
      # reports-c1/ + reports-c2/ per-config report dirs (design only — no
      # artifacts ship in this repo; see DEPLOYMENT.md).
      EVIDENCE_DIR: /evidence
    volumes:
      - ${EVIDENCE_HOST_DIR:-./evidence}:/evidence:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
