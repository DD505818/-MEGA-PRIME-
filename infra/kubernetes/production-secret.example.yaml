# Schema-only example. Never commit a populated copy.
# The deployment workflow creates omega-production from protected GitHub
# environment secrets and rejects non-TLS connection settings.
apiVersion: v1
kind: Secret
metadata:
  name: omega-production
  namespace: omega-prime
type: Opaque
stringData:
  KAFKA_BROKERS: "broker.example.invalid:9093"
  KAFKA_SECURITY_PROTOCOL: "SASL_SSL"
  KAFKA_SASL_MECHANISM: "PLAIN"
  KAFKA_SASL_USERNAME: "REDACTED"
  KAFKA_SASL_PASSWORD: "REDACTED"
  REDIS_URL: "rediss://user:REDACTED@redis.example.invalid:6379"
  POSTGRES_DSN: "postgresql://omega:REDACTED@postgres.example.invalid:5432/omega?sslmode=verify-full"
  JWT_SECRET: "REDACTED"
  GROQ_API_KEY: ""
