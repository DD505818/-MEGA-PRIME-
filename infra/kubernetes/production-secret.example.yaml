# Schema-only examples. Never commit populated copies.
# The deployment workflow creates these from protected GitHub environment
# secrets and requires TLS server verification.
apiVersion: v1
kind: Secret
metadata: {name: omega-kafka, namespace: omega-prime}
type: Opaque
stringData:
  KAFKA_BROKERS: "broker.example.invalid:9093"
  KAFKA_SECURITY_PROTOCOL: "SASL_SSL"
  KAFKA_SASL_MECHANISM: "PLAIN"
  KAFKA_SASL_USERNAME: "REDACTED"
  KAFKA_SASL_PASSWORD: "REDACTED"
---
apiVersion: v1
kind: Secret
metadata: {name: omega-redis, namespace: omega-prime}
type: Opaque
stringData:
  REDIS_URL: "rediss://user:REDACTED@redis.example.invalid:6379"
---
apiVersion: v1
kind: Secret
metadata: {name: omega-postgres, namespace: omega-prime}
type: Opaque
stringData:
  POSTGRES_DSN: "postgresql://omega:REDACTED@postgres.example.invalid:5432/omega?sslmode=verify-full"
---
apiVersion: v1
kind: Secret
metadata: {name: omega-websocket, namespace: omega-prime}
type: Opaque
stringData:
  JWT_SECRET: "REDACTED"
---
apiVersion: v1
kind: Secret
metadata: {name: omega-llm, namespace: omega-prime}
type: Opaque
stringData:
  GROQ_API_KEY: ""
