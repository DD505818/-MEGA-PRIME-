apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: omega-prime
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
      - op: add
        path: /spec/revisionHistoryLimit
        value: 3
