apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-service
  namespace: omega-prime
  labels: {app.kubernetes.io/name: risk-service, app.kubernetes.io/part-of: omega-prime}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: risk-service}}
  template:
    metadata: {labels: {app.kubernetes.io/name: risk-service, app.kubernetes.io/part-of: omega-prime}}
    spec:
      serviceAccountName: omega-runtime
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: risk-service
          image: ghcr.io/dd505818/omega-prime/risk-service:db1f614a8cc6a76326434f10be49b590d2afbba8
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: omega-runtime}}, {secretRef: {name: omega-production}}]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 5, failureThreshold: 3}
          livenessProbe: {tcpSocket: {port: http}, initialDelaySeconds: 15, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata: {name: risk-service, namespace: omega-prime}
spec:
  selector: {app.kubernetes.io/name: risk-service}
  ports: [{name: http, port: 8080, targetPort: http}]
---
