apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-service
  namespace: omega-prime
  labels: {app.kubernetes.io/name: risk-service, app.kubernetes.io/part-of: omega-prime}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: risk-service}}
  template:
    metadata: {labels: {app.kubernetes.io/name: risk-service, app.kubernetes.io/part-of: omega-prime}}
    spec:
      serviceAccountName: omega-runtime
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: risk-service
          image: ghcr.io/dd505818/omega-prime-risk-service@sha256:e8c9d6d0bbf7d7cee5943a5645ae0b29cffd3dfd6db224c2a8b2827eaa478aa4
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: omega-runtime}}, {secretRef: {name: omega-kafka}}, {secretRef: {name: omega-redis}}]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health/ready, port: http}, timeoutSeconds: 5, periodSeconds: 5, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /health/live, port: http}, timeoutSeconds: 5, initialDelaySeconds: 15, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata: {name: risk-service, namespace: omega-prime}
spec:
  selector: {app.kubernetes.io/name: risk-service}
  ports: [{name: http, port: 8080, targetPort: http}]
---
