apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-gateway
  namespace: omega-prime
  labels: {app.kubernetes.io/name: websocket-gateway, app.kubernetes.io/part-of: omega-prime}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: websocket-gateway}}
  template:
    metadata: {labels: {app.kubernetes.io/name: websocket-gateway, app.kubernetes.io/part-of: omega-prime}}
    spec:
      serviceAccountName: omega-runtime
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: websocket-gateway
          image: ghcr.io/dd505818/omega-prime/websocket-gateway:db1f614a8cc6a76326434f10be49b590d2afbba8
          envFrom: [{configMapRef: {name: omega-runtime}}, {secretRef: {name: omega-production}}]
          env: [{name: PORT, value: "3001"}]
          ports: [{name: http, containerPort: 3001}]
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: http}, initialDelaySeconds: 15}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
---
apiVersion: v1
kind: Service
metadata: {name: websocket-gateway, namespace: omega-prime}
spec:
  selector: {app.kubernetes.io/name: websocket-gateway}
  ports: [{name: http, port: 3001, targetPort: http}]
