apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-gateway
  namespace: omega-prime
  labels: {app.kubernetes.io/name: websocket-gateway, app.kubernetes.io/part-of: omega-prime}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: websocket-gateway}}
  template:
    metadata: {labels: {app.kubernetes.io/name: websocket-gateway, app.kubernetes.io/part-of: omega-prime}}
    spec:
      serviceAccountName: omega-runtime
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: websocket-gateway
          image: ghcr.io/dd505818/omega-prime-websocket-gateway@sha256:7137882a20813180d519a66d6c72350d74b697849e3cc15bb923d4213dd9d421
          envFrom: [{configMapRef: {name: omega-runtime}}, {secretRef: {name: omega-kafka}}, {secretRef: {name: omega-redis}}, {secretRef: {name: omega-websocket}}]
          env: [{name: PORT, value: "3001"}]
          ports: [{name: http, containerPort: 3001}]
          readinessProbe: {httpGet: {path: /health/ready, port: http}, timeoutSeconds: 5, periodSeconds: 5, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /health/live, port: http}, timeoutSeconds: 5, initialDelaySeconds: 15, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
---
