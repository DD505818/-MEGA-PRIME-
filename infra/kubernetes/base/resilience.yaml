apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: risk-service, namespace: omega-prime}
spec: {minAvailable: 1, selector: {matchLabels: {app.kubernetes.io/name: risk-service}}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: execution-service, namespace: omega-prime}
spec: {minAvailable: 1, selector: {matchLabels: {app.kubernetes.io/name: execution-service}}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: truth-core, namespace: omega-prime}
spec: {minAvailable: 1, selector: {matchLabels: {app.kubernetes.io/name: truth-core}}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: risk-service, namespace: omega-prime}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: risk-service}
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleUp: {stabilizationWindowSeconds: 30, policies: [{type: Percent, value: 100, periodSeconds: 60}]}
    scaleDown: {stabilizationWindowSeconds: 300, policies: [{type: Percent, value: 25, periodSeconds: 60}]}
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: websocket-gateway, namespace: omega-prime}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: websocket-gateway}
  minReplicas: 2
  maxReplicas: 8
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
