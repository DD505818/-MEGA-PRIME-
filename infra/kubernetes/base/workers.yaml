apiVersion: apps/v1
kind: Deployment
metadata:
  name: capital-allocator
  namespace: omega-prime
  labels: {app.kubernetes.io/name: capital-allocator, app.kubernetes.io/part-of: omega-prime}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: capital-allocator}}
  template:
    metadata: {labels: {app.kubernetes.io/name: capital-allocator, app.kubernetes.io/part-of: omega-prime}}
    spec:
      serviceAccountName: omega-runtime
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: capital-allocator
          image: ghcr.io/dd505818/omega-prime/capital-allocator:db1f614a8cc6a76326434f10be49b590d2afbba8
          envFrom: [{configMapRef: {name: omega-runtime}}, {secretRef: {name: omega-production}}]
          ports: [{name: http, containerPort: 8082}]
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: http}, initialDelaySeconds: 15}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
---
apiVersion: v1
kind: Service
metadata: {name: capital-allocator, namespace: omega-prime}
spec:
  selector: {app.kubernetes.io/name: capital-allocator}
  ports: [{name: http, port: 8082, targetPort: http}]
---
