apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data-service
  namespace: omega-prime
  labels: {app.kubernetes.io/name: market-data-service, app.kubernetes.io/part-of: omega-prime}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: market-data-service}}
  template:
    metadata: {labels: {app.kubernetes.io/name: market-data-service, app.kubernetes.io/part-of: omega-prime}}
    spec:
      serviceAccountName: omega-runtime
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: market-data-service
          image: ghcr.io/dd505818/omega-prime/market-data-service:db1f614a8cc6a76326434f10be49b590d2afbba8
          envFrom: [{configMapRef: {name: omega-runtime}}, {secretRef: {name: omega-production}}]
          resources: {requests: {cpu: 250m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
      terminationGracePeriodSeconds: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-engine
  namespace: omega-prime
  labels: {app.kubernetes.io/name: feature-engine, app.kubernetes.io/part-of: omega-prime}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: feature-engine}}
  template:
    metadata: {labels: {app.kubernetes.io/name: feature-engine, app.kubernetes.io/part-of: omega-prime}}
    spec:
      serviceAccountName: omega-runtime
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: feature-engine
          image: ghcr.io/dd505818/omega-prime/feature-engine:db1f614a8cc6a76326434f10be49b590d2afbba8
          env: [{name: PYTHONDONTWRITEBYTECODE, value: "1"}]
          envFrom: [{configMapRef: {name: omega-runtime}}, {secretRef: {name: omega-production}}]
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 256Mi}}]
---
