apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data-service
  namespace: omega-prime
  labels: {app.kubernetes.io/name: market-data-service, app.kubernetes.io/part-of: omega-prime}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: market-data-service}}
  template:
    metadata: {labels: {app.kubernetes.io/name: market-data-service, app.kubernetes.io/part-of: omega-prime}}
    spec:
      serviceAccountName: omega-runtime
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: market-data-service
          image: ghcr.io/dd505818/omega-prime-market-data-service@sha256:d74e274cb03021ec4e034921450df02bb73b3577d9465018c53b4767b1c20e77
          envFrom: [{configMapRef: {name: omega-runtime}}, {secretRef: {name: omega-kafka}}]
          ports: [{name: http, containerPort: 8090}]
          readinessProbe: {httpGet: {path: /health/ready, port: http}, timeoutSeconds: 5, periodSeconds: 5, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /health/live, port: http}, timeoutSeconds: 5, initialDelaySeconds: 15, periodSeconds: 10}
          resources: {requests: {cpu: 250m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
      terminationGracePeriodSeconds: 60
---
