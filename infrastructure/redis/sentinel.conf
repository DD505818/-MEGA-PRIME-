# ΩMEGA PRIME Δ — Redis Sentinel configuration
#
# One sentinel watching the omegamaster group (redis:6379 + redis-replica).
# Quorum is 1 because this stack runs a SINGLE sentinel: a majority of one.
#
# HONEST LIMITATION (see docs/redis-ha.md): our Go/Python services use plain
# redis:// URLs with no Sentinel-aware client. Sentinel failover therefore
# does NOT propagate to application clients automatically — a human operator
# must re-point or restart clients after a failover. Do not assume otherwise.
#
# Production guidance: run 3 sentinels (quorum 2) on separate hosts.

port 26379
dir /tmp

sentinel monitor omegamaster redis 6379 1
sentinel down-after-milliseconds omegamaster 5000
sentinel failover-timeout omegamaster 15000
sentinel parallel-syncs omegamaster 1
