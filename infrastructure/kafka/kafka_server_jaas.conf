# Kafka JAAS — broker side (SCRAM-SHA-512)
#
# Mounted read-only into the kafka service at /etc/kafka/kafka_server_jaas.conf
# via KAFKA_OPTS=-Djava.security.auth.login.config=...
#
# The KafkaServer ScramLoginModule validates SASL_PLAINTEXT clients against
# SCRAM credentials stored in Zookeeper (created by the one-time bootstrap in
# docs/kafka-acls.md). The static username/password below is used ONLY for
# inter-broker communication; with a single broker it is never exercised for
# client auth, but the section is syntactically required.
#
# Bootstrap creates per-service SCRAM users (strategy, risk, execution, admin)
# — those credentials live in ZK, not in this file.

KafkaServer {
  org.apache.kafka.common.security.scram.ScramLoginModule required
  username="interbroker"
  password="CHANGE-ME-via-docs/kafka-acls.md-bootstrap";
};
